<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高对比度护眼主题预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #15181f;
    color: #e8ecf3;
    padding: 32px 24px 64px;
    line-height: 1.5;
  }
  .page-head { max-width: 1180px; margin: 0 auto 28px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .page-head p { margin-top: 8px; color: #9aa6b8; font-size: 13px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: #aab4c4; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .grid {
    max-width: 1180px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
  }
  .card {
    background: #1d2129;
    border: 1px solid #2b3038;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card-title {
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #2b3038;
  }
  .card-title .name { font-size: 15px; font-weight: 600; }
  .card-title .kind {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: #c4cdda;
  }
  /* ===== 模拟应用窗口 ===== */
  .mock { padding: 14px; }
  .win {
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(0,0,0,.25);
    font-size: 12px;
  }
  .win-title {
    height: 34px; display: flex; align-items: center; padding: 0 10px;
    gap: 8px;
  }
  .win-title .tt { flex: 1; font-weight: 600; font-size: 12px; }
  .win-title .ctrl { width: 11px; height: 11px; border-radius: 50%; }
  .win-body { padding: 10px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .btn {
    padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
    border: none; cursor: default;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
  }
  .row .ch { flex: 1; font-weight: 600; }
  .row .meta { font-size: 11px; opacity: .8; }
  .pill {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid;
  }
  .win-foot {
    padding: 7px 10px; font-size: 11px; display: flex; justify-content: space-between;
  }
  /* ===== 颜色样本 ===== */
  .swatches { display: flex; padding: 12px 14px; gap: 0; border-top: 1px solid #2b3038; }
  .sw { flex: 1; text-align: center; }
  .sw .c { height: 30px; border-radius: 6px 6px 0 0; }
  .sw:first-child .c { border-radius: 6px 0 0 6px; }
  .sw:last-child .c { border-radius: 0 6px 6px 0; }
  .sw .lab { font-size: 9px; color: #8b95a5; margin-top: 4px; }
  .metrics {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px 14px; font-size: 12px; color: #b9c2d0;
  }
  .contrast { font-weight: 700; }
  .tag-aaa { color: #5fd38a; }
  .tag-aa  { color: #e8c25a; }
  .note { padding: 0 16px 16px; font-size: 11px; color: #7f8a9a; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>高对比度护眼主题 · 可视化预览</h1>
    <p>六款新主题已写入 <code>AppTheme.cs</code> 并接入应用主题菜单。背景采用柔和低眩光色调，文字保持强可读性，正文对比度均达到 WCAG AA / AAA 级。</p>
    <div class="legend">
      <span><i class="dot" style="background:#5fd38a"></i>浅色护眼（低眩光暖/冷调）</span>
      <span><i class="dot" style="background:#7aa2f7"></i>深色护眼（非纯黑，降低刺眼）</span>
      <span><i class="dot" style="background:#e8c25a"></i>对比度达标标识</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>

<script>
// 主题数据（与 AppTheme.cs 一致）
const themes = [
  { name:"暖玉米白", kind:"浅色", bg:"#f5eed7", bgAlt:"#eee5cb", surface:"#e8dec3",
    primary:"#b88630", accent:"#c44860", text:"#28241e", text2:"#665e50",
    border:"#cec2a5", header:"#ece2c8", select:"#ded3b7", statusbar:"#e2d7bc",
    play:"#3ca05a", copy:"#3c82c3", pill:"#e4dac0", pillBorder:"#3c8c50",
    success:"#329650", error:"#c83c3c", note:"暖米黄背景替代纯白，降低屏幕眩光，适合长时间浏览。" },
  { name:"青瓷薄荷", kind:"浅色", bg:"#dff0e6", bgAlt:"#d4e8dc", surface:"#cde3d6",
    primary:"#289169", accent:"#c84e78", text:"#1a342c", text2:"#5a746a",
    border:"#b4d2c2", header:"#d6e9de", select:"#c3dccd", statusbar:"#cee4d8",
    play:"#289664", copy:"#3782c3", pill:"#c8e0d2", pillBorder:"#288c5f",
    success:"#28965f", error:"#c84141", note:"淡薄荷绿缓解视觉疲劳，青瓷质感清爽不刺眼。" },
  { name:"淡雾蓝", kind:"浅色", bg:"#dfe8f4", bgAlt:"#d4dfee", surface:"#cdd9ea",
    primary:"#2d73af", accent:"#b448a0", text:"#1c2a3c", text2:"#58687c",
    border:"#b2c1d6", header:"#d6e1f0", select:"#c4d1e4", statusbar:"#cedaec",
    play:"#2d9664", copy:"#2d7dbe", pill:"#c8d5e8", pillBorder:"#2d8c5f",
    success:"#28965f", error:"#c84141", note:"雾面浅蓝冷静舒缓，蓝色波长柔和，适合夜间使用。" },
  { name:"藕粉柔光", kind:"浅色", bg:"#f6e4e6", bgAlt:"#efdbde", surface:"#e9d4d7",
    primary:"#ba607c", accent:"#c86e3c", text:"#36242a", text2:"#746066",
    border:"#d0b8bc", header:"#f0dde0", select:"#e2ccd0", statusbar:"#e8d3d6",
    play:"#3c9b64", copy:"#3c82c3", pill:"#e6d0d4", pillBorder:"#3c8c55",
    success:"#329655", error:"#c84141", note:"藕荷粉调温柔护眼，低饱和度避免色彩刺激。" },
  { name:"深空墨蓝", kind:"深色", bg:"#181e2b", bgAlt:"#202736", surface:"#262e3f",
    primary:"#5fa5eb", accent:"#e88eaf", text:"#e6eefa", text2:"#a5b2c6",
    border:"#3c465a", header:"#202736", select:"#323e54", statusbar:"#202736",
    play:"#3caf78", copy:"#3c8ccd", pill:"#283442", pillBorder:"#3caf78",
    success:"#46c382", error:"#f06464", note:"深蓝而非纯黑，减少强反差刺眼，暗环境舒适。" },
  { name:"墨绿夜", kind:"深色", bg:"#182721", bgAlt:"#20322a", surface:"#263a31",
    primary:"#5fb991", accent:"#e896af", text:"#e2f0e6", text2:"#a7beb2",
    border:"#3a5246", header:"#20322a", select:"#344c40", statusbar:"#20322a",
    play:"#37af78", copy:"#3c8cc8", pill:"#283c33", pillBorder:"#37af78",
    success:"#46c387", error:"#f06969", note:"墨绿夜色护眼经典，绿色系对视网膜更友好。" }
];

// 计算相对亮度与对比度
function lum(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const f=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
function contrast(h1,h2){ const a=lum(h1)+0.05,b=lum(h2)+0.05; const r=Math.max(a,b)/Math.min(a,b); return r; }

const rows = [
  { ch:"CCTV-1 综合", meta:"18ms", ok:true },
  { ch:"湖南卫视", meta:"32ms", ok:true },
  { ch:"浙江卫视", meta:"超时", ok:false }
];

const grid = document.getElementById('grid');
themes.forEach(t=>{
  const cr = contrast(t.text, t.bg);
  const crLabel = cr>=7 ? `<span class="tag-aaa">AAA ${cr.toFixed(1)}:1</span>` : (cr>=4.5?`<span class="tag-aa">AA ${cr.toFixed(1)}:1</span>`:`${cr.toFixed(1)}:1`);
  const rowHtml = rows.map((r,i)=>`
    <div class="row" style="background:${i===1?t.select:t.surface};color:${i===1?t.text:t.text}">
      <div class="ch">${r.ch}</div>
      <div class="meta">${r.meta}</div>
      <div class="pill" style="color:${r.ok?t.success:t.error};background:${t.pill};border-color:${r.ok?t.success:t.error}">${r.ok?'在线':'离线'}</div>
    </div>`).join('');
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <div class="card-title">
      <span class="name">${t.name}</span>
      <span class="kind" style="color:${t.kind==='深色'?'#7aa2f7':'#5fd38a'}">${t.kind}</span>
    </div>
    <div class="mock">
      <div class="win" style="background:${t.bg};color:${t.text}">
        <div class="win-title" style="background:${t.header};color:${t.text}">
          <span class="ctrl" style="background:#e06c6c"></span>
          <span class="ctrl" style="background:#e0c06c"></span>
          <span class="ctrl" style="background:#6cae6c"></span>
          <span class="tt">IPTV 直播源检测 · ${t.name}</span>
        </div>
        <div class="win-body">
          <div class="toolbar">
            <button class="btn" style="background:${t.play};color:#fff">播放</button>
            <button class="btn" style="background:${t.copy};color:#fff">复制</button>
            <button class="btn" style="background:${t.surface};color:${t.text};border:1px solid ${t.border}">检测全部</button>
          </div>
          ${rowHtml}
        </div>
        <div class="win-foot" style="background:${t.statusbar};color:${t.text2}">
          <span>共 312 个源 · 在线 287</span>
          <span style="color:${t.primary};font-weight:600">已选 ${t.name}</span>
        </div>
      </div>
    </div>
    <div class="swatches">
      ${[['背景',t.bg],['表面',t.surface],['主色',t.primary],['点缀',t.accent],['文字',t.text],['成功',t.success],['错误',t.error]]
        .map(([l,c])=>`<div class="sw"><div class="c" style="background:${c}"></div><div class="lab">${l}</div></div>`).join('')}
    </div>
    <div class="metrics">
      <span>正文对比度</span>
      <span class="contrast">${crLabel}</span>
    </div>
    <div class="note">${t.note}</div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
